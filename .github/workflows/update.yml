name: Update playlist

on:
  schedule:
    # 为什么设三个点：GitHub 的 schedule 是「尽力而为」，高负载时整次调度会被直接丢弃
    # ——不是延迟，是压根没有这次运行、也没有任何报错。2026-11-03 就丢过 09:50 UTC 那一次
    # （配置本身没问题：默认分支、active、非 fork 全部正常）。多挂几个时间点，任意一次命中就够，
    # 代价只是多跑两次构建（public 仓库 Actions 分钟数不限，内容没变不会产生多余提交）。
    # 北京时间 17:50 / 18:50 / 19:50
    - cron: "50 9 * * *"
    - cron: "50 10 * * *"
    - cron: "50 11 * * *"
    # 临时验证点：今天 21:00（北京）确认定时器是否恢复，验证完删除本行
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        env:
          # 顺序即优先级（同频道取前 3 条存活地址）
          SOURCES: >-
            https://guovin.github.io/iptv-api/result.m3u,
            https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv4.m3u,
            https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u,
            https://iptv-org.github.io/iptv/countries/cn.m3u
        run: python scripts/build_playlist.py --out-dir public --workers 32 --timeout 8 --max-uris 3

      - name: Commit result
        run: |
          git config user.name  "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh playlist $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时自动创建 Pages 站点（无需手工去 Settings 里开）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
